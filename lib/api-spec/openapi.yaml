openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: taste
    description: Movie recommendations
paths:
  /taste/recommend:
    post:
      operationId: recommendMovie
      tags: [taste]
      summary: Recommend one movie from three favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TasteInput"
      responses:
        "200":
          description: One movie recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieRecommendation"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    TasteInput:
      type: object
      required: [book, music, third]
      properties:
        book: { type: string, minLength: 1, maxLength: 300 }
        music: { type: string, minLength: 1, maxLength: 300 }
        third: { type: string, minLength: 1, maxLength: 300 }
        excluded_titles:
          type: array
          items: { type: string, maxLength: 300 }
        excluded_genres:
          type: array
          items:
            $ref: "#/components/schemas/MovieGenre"
    MovieGenre:
      type: string
      enum: [Action, Adventure, Animation, Comedy, Crime, Documentary, Drama, Family, Fantasy, History, Horror, Music, Mystery, Romance, Science Fiction, Thriller, War, Western]
    InputNote:
      type: object
      required: [input, issue, note]
      properties:
        input: { type: string, enum: [book, music, third] }
        issue: { type: string, enum: [unfamiliar, wrong_type, ambiguous] }
        note: { type: string, minLength: 1 }
    MovieRecommendation:
      type: object
      required: [title, year, one_sentence_rationale, genre, driver_input, confidence, input_notes]
      properties:
        title: { type: string, minLength: 1 }
        year: { type: integer, minimum: 1888 }
        one_sentence_rationale: { type: string, minLength: 1 }
        genre:
          $ref: "#/components/schemas/MovieGenre"
        driver_input: { type: [string, "null"], enum: [book, music, third, null] }
        confidence: { type: string, enum: [strong, loose] }
        input_notes:
          type: array
          items:
            $ref: "#/components/schemas/InputNote"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

