openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: taste
    description: Movie recommendations
paths:
  /taste/recommend:
    post:
      operationId: recommendMovie
      tags: [taste]
      summary: Recommend one movie from three favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TasteInput"
      responses:
        "200":
          description: One movie recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieRecommendation"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    TasteInput:
      type: object
      required: [book, music, third]
      properties:
        book: { type: string, minLength: 1, maxLength: 300 }
        music: { type: string, minLength: 1, maxLength: 300 }
        third: { type: string, minLength: 1, maxLength: 300 }
    MovieRecommendation:
      type: object
      required: [title, year, one_sentence_rationale]
      properties:
        title: { type: string }
        year: { type: integer }
        one_sentence_rationale: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

